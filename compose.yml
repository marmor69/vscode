services:
  icm-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      # Use proxy only behind an authenticated reverse proxy such as Cloudflare Access.
      ICM_AUTH_MODE: ${ICM_AUTH_MODE:-token}
      ICM_CONNECTION_TOKEN: ${ICM_CONNECTION_TOKEN:-}
      ICM_INIT_EXAMPLE: ${ICM_INIT_EXAMPLE:-true}
      ICM_INSTALL_OFFICE: ${ICM_INSTALL_OFFICE:-true}
      ICM_INSTALL_CLAUDE: ${ICM_INSTALL_CLAUDE:-true}
      ICM_CLAUDE_VERSION: ${ICM_CLAUDE_VERSION:-latest}
      ICM_INSTALL_CODEX: ${ICM_INSTALL_CODEX:-true}
      # Official Codex VSIX release; existing installs are reconciled on startup.
      ICM_CODEX_VERSION: ${ICM_CODEX_VERSION:-26.1007.21434}
      # Public HTTPS port, independent of HTTP ports between Cloudflare and Traefik.
      ICM_PUBLIC_PORT: ${ICM_PUBLIC_PORT:-443}
    volumes:
      - icm-workspaces:/workspaces
      # Includes settings, installed extensions, Codex/Claude credentials, and npm prefix.
      - icm-home:/home/node
    expose:
      - "8080"
    networks:
      - dokploy-network
    security_opt:
      - no-new-privileges:true
      # Keep Docker's syscall filter, allowing the namespaces used by Codex/bubblewrap.
      - seccomp:./docs/docker/seccomp.json
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  icm-workspaces:
  icm-home:

networks:
  dokploy-network:
    external: true
